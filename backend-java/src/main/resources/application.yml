spring:
  application:
    name: modern-munim
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/marketplace_db}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Existing Alembic schema is source of truth — do not auto-mutate.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  security:
    jwt-secret: ${SECRET_KEY}
    jwt-algorithm: ${ALGORITHM:HS256}
    access-token-expire-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:30}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    bootstrap-admin-token: ${BOOTSTRAP_ADMIN_TOKEN:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
  ai:
    # Python AI service base URL (Sprint #1: documented boundary only)
    base-url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    root: INFO
    com.modernmunim: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:mm_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  security:
    jwt-secret: test-secret-key-minimum-32-characters-long!!
    access-token-expire-minutes: 30
  cors:
    allowed-origins: http://localhost:3000
